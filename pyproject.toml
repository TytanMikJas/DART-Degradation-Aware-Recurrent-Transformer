[project]
name = "dart"
version = "1.0.0"
description = "DART: A Degradation-Aware Recurrent Transformer for Archival Film Restoration (ACCV 2026)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [
    { name = "Mikołaj Jastrzębski" },
    { name = "Wojciech Kozłowski" },
    { name = "Kamil Adamczewski" },
]
# Windows: Python 3.11-3.12 (pyiqa pins transformers==4.37.2; its tokenizers has no
# Windows wheel for 3.13). Linux: 3.11-3.13. The default is .python-version (3.12).
requires-python = ">=3.11,<3.14"
dependencies = [
    "albumentations==2.0.8",
    "hydra-core==1.3.2",
    "numpy==2.3.4",
    "opencv-python==4.11.0.86",
    "pandas==2.3.3",
    "pyiqa==0.1.14.1",
    "pytorch-lightning==2.5.5",
    "safetensors==0.6.2",
    "scipy==1.16.2",
    "setuptools==80.9.0",  # pkg_resources, needed by openai-clip (CLIPIQA+ in pyiqa)
    "tabulate==0.9.0",
    "timm==1.0.22",
    "torch==2.9.0",
    "torchmetrics==1.8.2",
    "torchvision==0.24.0",
    "tqdm==4.67.1",
    "wandb==0.22.2",
]

[project.urls]
Paper = "https://arxiv.org/abs/2607.21219"
Homepage = "https://absolutecinema.absolutedegradation.workers.dev"
Repository = "https://github.com/TytanMikJas/DART-Degradation-Aware-Recurrent-Transformer"
AbsoluteDegradation = "https://github.com/TytanMikJas/AbsoluteDegradation"

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "ruff==0.14.2",
]

[tool.uv]
# The code is run from the repository (scripts/*.py); it is not installed as a package.
package = false

[tool.ruff]
line-length = 88
# Vendored copy of the official RAFT code, kept unmodified.
extend-exclude = ["src/models/optical_flow/third_party"]
lint.select = ["E", "F", "W", "I"]
lint.ignore = ["E501"]

# --- PyTorch CUDA (GPU) wheels ---------------------------------------------
# PyPI serves the CPU-only torch wheel on Windows, so `uv sync` would install a
# CPU build. These sections pin torch/vision to the CUDA 12.6 index on
# Linux/Windows (macOS has no CUDA and falls back to PyPI). Change cu126 -> cu128
# for CUDA 12.8 if your driver requires it. The CUDA build also runs on the CPU.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
